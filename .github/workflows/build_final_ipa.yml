name: Build Triumph 2.134 + iGameGod Final IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Final IPA
    runs-on: macos-latest
    timeout-minutes: 60
    
    steps:
    - name: Set download URLs
      run: |
        # REPLACE YOUR_USERNAME below
        echo "TRIUMPH_IPA_URL=https://github.com/wyattpacker274-stack/triumph-igg-builder/releases/download/v1.0/com.triumphsdkprod-2.134.0-Decrypted.ipa" >> $GITHUB_ENV
        echo "IGG_DEB_URL=https://github.com/wyattpacker274-stack/triumph-igg-builder/releases/download/v1.0/com.gamegod.igg_0.8.9.5_iphoneos-arm.deb" >> $GITHUB_ENV
    
    - name: Download Triumph 2.134.0 IPA
      run: |
        curl -L -o /tmp/triumph.ipa "$TRIUMPH_IPA_URL"
        echo "Triumph IPA: $(ls -lh /tmp/triumph.ipa)"
    
    - name: Download iGameGod .deb
      run: |
        curl -L -o /tmp/igg.deb "$IGG_DEB_URL"
        echo "iGameGod DEB: $(ls -lh /tmp/igg.deb)"
    
    - name: Build Complete Modified IPA
      run: |
        set -e
        cd /tmp
        
        # Extract Triumph
        echo "Extracting Triumph..."
        unzip -q triumph.ipa -d triumph_extract
        TRIUMPH_APP=$(find triumph_extract/Payload -name "*.app" -type d | head -1)
        
        # Extract iGameGod
        echo "Extracting iGameGod..."
        mkdir -p igg_extract
        cd igg_extract
        ar x ../igg.deb
        tar -xf data.tar.lzma
        tar -xf data.tar
        cd ..
        
        # Python build script
        cat > build.py << 'PYEOF'
        import os, sys, shutil, plistlib, random, string, zipfile, subprocess
        from pathlib import Path
        
        WORK = Path('/tmp/work')
        OUT_IPA = Path('/tmp/Triumph_2.134_iGameGod_FINAL.ipa')
        
        RANDOMIZE = True; STRIP = True; REMOVE_SIGS = True
        
        def rs(n=8): return ''.join(random.choices(string.ascii_lowercase+string.digits,k=n))
        def rb(): return f"{random.choice(['com','org','net','io','app','dev','tools','utils','sys','core'])}.{random.choice(['apple','ios','mobile','device','system','framework','kit','lib','api','svc','arcade','game','play'])}.{rs(6)}.{rs(4)}"
        
        def mod_plist(p, bid, name, dname, triumph=True):
            with open(p,'rb') as f: pl=plistlib.load(f)
            if RANDOMIZE:
                pl['CFBundleIdentifier']=bid; pl['CFBundleName']=name; pl['CFBundleDisplayName']=dname; pl['CFBundleExecutable']=name
            if triumph:
                pl['CFBundleShortVersionString']=f"{random.randint(1,9)}.{random.randint(0,9)}.{random.randint(0,9)}"
                pl['CFBundleVersion']=str(random.randint(100,999))
            else:
                pl['CFBundleShortVersionString']=f"{random.randint(1,9)}.{random.randint(0,9)}.{random.randint(0,9)}.{random.randint(0,9)}"
                pl['CFBundleVersion']=str(random.randint(1,999))
            pl['DTXcode']=str(random.randint(2600,2750))
            pl['DTXcodeBuild']=f"{random.randint(26,28)}A{random.randint(1000,9999)}"
            pl['DTCompiler']='com.apple.compilers.llvm.clang.1_0'
            pl['DTPlatformVersion']=f"{random.randint(17,26)}.{random.randint(0,9)}"
            pl['DTSDKName']=f"iphoneos{pl['DTPlatformVersion']}"
            pl['DTSDKBuild']=pl['DTXcodeBuild']
            pl['DTPlatformBuild']=pl['DTXcodeBuild']
            pl['BuildMachineOSBuild']=f"{random.randint(23,25)}G{random.randint(100,999)}"
            if 'CFBundleURLTypes' in pl:
                for u in pl['CFBundleURLTypes']:
                    if 'CFBundleURLSchemes' in u: u['CFBundleURLSchemes']=[f"{name.lower()}open",f"scheme{rs(6)}"]
                    if 'CFBundleURLName' in u: u['CFBundleURLName']=f"{bid}.open"
            if 'UIApplicationShortcutItems' in pl:
                for i in pl['UIApplicationShortcutItems']:
                    if 'UIApplicationShortcutItemType' in i: i['UIApplicationShortcutItemType']=f"quickopen.{rs(8)}"
            with open(p,'wb') as f: plistlib.dump(pl,f)
        
        def strip_bin(p):
            if not STRIP: return
            try: subprocess.run(['strip','-x',str(p)], capture_output=True)
            except: pass
        
        def remove_sigs(app, triumph=True):
            ts=['triumph','TriumphApp','TriumphCore','TriumphService','TriumphUI','triumphsdk','triumphsdkprod']
            ig=['iGameGod','gamegod','IGG','iGSpoof','bfdecrypt','flexdecrypt','fouldecrypt','kernrw','krw','libloader','substrate','MobileSubstrate','CydiaSubstrate','iGameGodLoader']
            an=['Amplitude','Apollo','Datadog','Facebook','Factory','IOSSecuritySuite','KSCrash','Mintegral','PhoneNumberKit','QRCode','SwiftMessages','TOCropViewController','ZIPFoundation']
            all_sigs=(ts if triumph else [])+ig+an
            for root,dirs,files in os.walk(app):
                for f in files:
                    fp=Path(root)/f; ln=f.lower()
                    for s in all_sigs:
                        if s.lower() in ln:
                            try: fp.rename(fp.parent/f"{rs(12)}{fp.suffix}")
                            except: pass
                            break
                for d in dirs:
                    dp=Path(root)/d; ld=d.lower()
                    for s in all_sigs:
                        if s.lower() in ld:
                            try: dp.rename(dp.parent/f"{rs(10)}.bundle")
                            except: pass
                            break
        
        def setup():
            payload=WORK/"Payload"; app=payload/"TriumphApp.app"
            if WORK.exists(): shutil.rmtree(WORK)
            payload.mkdir(parents=True)
            return payload,app
        
