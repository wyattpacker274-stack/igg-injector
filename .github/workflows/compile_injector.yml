name: Compile iGameGod Injector FIXED

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
    - name: Compile FIXED injector dylib for iOS
      run: |
        xcrun -sdk iphoneos clang -shared -fobjc-arc \
          -framework Foundation -framework UIKit \
          -arch arm64 -miphoneos-version-min=13.0 \
          -o iGameGodInjector.dylib iGameGodInjector.c
        echo "Build successful!"
        file iGameGodInjector.dylib
        codesign --sign - --force iGameGodInjector.dylib || true
    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: iGameGodInjector-dylib-FIXED
        path: iGameGodInjector.dylib
        retention-days: 30
